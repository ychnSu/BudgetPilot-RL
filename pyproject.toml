[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetpilot-rl"
version = "0.1.0"
description = "Budget-aware repository repair agent and RL research scaffold"
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "PyYAML>=6", "langgraph>=0.2"]

[project.optional-dependencies]
data = ["datasets>=3", "pyarrow>=15"]
train = ["torch>=2.4", "transformers>=4.51"]
eval = ["swebench"]

[project.scripts]
budgetpilot = "budgetpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
